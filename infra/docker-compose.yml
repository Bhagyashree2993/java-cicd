# Local Jenkins + SonarQube for learning / testing the pipeline.
#   cd infra && docker compose up -d --build
#   Jenkins   → http://localhost:8080   (initial password: docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword)
#   SonarQube → http://localhost:9000   (admin / admin, you'll be asked to change it)
#
# SonarQube needs this on the Docker host (Linux):  sudo sysctl -w vm.max_map_count=524288
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root                      # lets the container use the host Docker socket
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
