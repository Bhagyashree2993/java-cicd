# Local Jenkins + SonarQube for the pipeline.
#   cd infra && docker compose up -d --build
#   Jenkins   -> http://127.0.0.1:8090   (port 8080 is left free for the Habit Tracker app)
#   SonarQube -> http://127.0.0.1:9000
# SonarQube on Docker Desktop needs:  wsl -d docker-desktop sysctl -w vm.max_map_count=524288
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root                      # lets the container use the host Docker socket
    ports:
      - "8090:8080"                 # host 8090 -> Jenkins 8080 (inside Docker it is still jenkins:8080)
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
