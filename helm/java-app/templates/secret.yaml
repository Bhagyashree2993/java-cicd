{{- /*
  Chart-managed Secret. Only for NON-production placeholder values.
  For real credentials, create the Secret outside Git (kubectl, Sealed Secrets,
  External Secrets, ...) and set `secret.existingSecret` to its name.
*/ -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "java-app.fullname" . }}
  labels:
    {{- include "java-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
