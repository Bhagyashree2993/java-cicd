# Default values for java-app.
# NOTE: image.repository and image.tag are updated automatically by Jenkins
# (stage "Update Helm values"). Argo CD detects the commit and syncs.

replicaCount: 2

image:
  repository: docker.io/guvibhagyashreekhandare/java-app
  tag: "5-4c2e880"
  pullPolicy: IfNotPresent

# For a private registry, create a docker-registry secret and reference it here:
#   kubectl create secret docker-registry regcred -n java-app \
#     --docker-server=docker.io --docker-username=<user> --docker-password=<token>
imagePullSecrets: []
#  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /actuator/prometheus
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

containerPort: 8080

# Non-sensitive application configuration -> rendered into a ConfigMap and
# injected as environment variables (envFrom). Changing a value rolls the pods.
config:
  APP_ENV: production
  LOG_LEVEL: INFO

# Sensitive configuration -> Kubernetes Secret, injected as environment variables.
#  * secret.data below holds PLACEHOLDERS only. Never commit real credentials here.
#  * For real values, create the Secret out-of-band (kubectl / Sealed Secrets /
#    External Secrets) and point existingSecret at it:
#      kubectl -n java-app create secret generic java-app-secrets \
#        --from-literal=APP_API_KEY='<value>'
#      -> then set  secret.existingSecret: java-app-secrets
secret:
  create: true
  existingSecret: ""
  data:
    APP_API_KEY: "change-me-placeholder"

# Plain environment variables (not config/secret) set directly on the container.
env:
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

# Exposure: use EITHER a LoadBalancer Service OR the Ingress below.
#   LoadBalancer (Docker Desktop / cloud):  service.type: LoadBalancer
#   Ingress (needs an ingress controller):  ingress.enabled: true
service:
  type: LoadBalancer   # Docker Desktop publishes this on http://localhost:80
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: java-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
