# Default values for java-app.
# NOTE: image.repository and image.tag are updated automatically by Jenkins
# (stage "Update Helm values"). Argo CD detects the commit and syncs.

replicaCount: 2

image:
  repository: docker.io/guvibhagyashreekhandare/java-app
  tag: "5-4c2e880"
  pullPolicy: IfNotPresent

# For a private registry, create a docker-registry secret and reference it here:
#   kubectl create secret docker-registry regcred -n java-app \
#     --docker-server=docker.io --docker-username=<user> --docker-password=<token>
imagePullSecrets: []
#  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /actuator/prometheus
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

containerPort: 8080

env:
  APP_ENV: production
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: java-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
