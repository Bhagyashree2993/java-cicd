{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "habit-tracker.fullname" . }}
  labels:
    {{- include "habit-tracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "habit-tracker.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
