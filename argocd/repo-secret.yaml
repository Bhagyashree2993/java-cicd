# Only needed if the GitHub repo is PRIVATE. Fill in the PAT locally and apply:
#   kubectl apply -f argocd/repo-secret.yaml
# Never commit a real token to Git.
apiVersion: v1
kind: Secret
metadata:
  name: java-cicd-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/Bhagyashree2993/java-cicd.git
  username: Bhagyashree2993
  password: <GITHUB_PERSONAL_ACCESS_TOKEN>
