# Only needed if the GitHub repo is PRIVATE.
# Replace the placeholders, then:  kubectl apply -f argocd/repo-secret.yaml
# (Don't commit real tokens — apply this from your machine and keep it out of Git.)
apiVersion: v1
kind: Secret
metadata:
  name: java-cicd-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/your-github-username/java-cicd.git
  username: your-github-username
  password: <GITHUB_PERSONAL_ACCESS_TOKEN>
