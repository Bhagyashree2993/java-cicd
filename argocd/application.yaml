# Argo CD Application — watches helm/java-app in this repo and keeps the
# cluster in sync with it. Apply once:  kubectl apply -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # delete app resources when the Application is deleted
spec:
  project: default
  source:
    repoURL: https://github.com/Bhagyashree2993/java-cicd.git
    targetRevision: main
    path: helm/java-app
    helm:
      releaseName: java-app
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: java-app
  syncPolicy:
    automated:
      prune: true        # remove resources deleted from Git
      selfHeal: true     # revert manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
