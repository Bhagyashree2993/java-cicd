# Argo CD Application - watches helm/habit-tracker in Git and keeps the cluster in sync.
# Apply once:  kubectl apply -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: habit-tracker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # remove app resources when the Application is deleted
spec:
  project: default
  source:
    repoURL: https://github.com/Bhagyashree2993/java-cicd.git
    targetRevision: main
    path: helm/habit-tracker
    helm:
      releaseName: habit-tracker
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: habit-tracker
  syncPolicy:
    automated:
      prune: true        # delete resources removed from Git
      selfHeal: true     # undo manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10   # deployment history used for rollback in the Argo CD UI
